notes:
  - Hardware floors are not yet tested. They are derived from the file size and arithmetic, not from a publisher statement.
  - This is the smaller build, with 2-bit experts. The model card reports that it complies more often than the Q4_K_M build on the publisher's harmful-request tests, and that it loses more MMLU score (5.08 points against 2.85). Both claims are the publisher's own.
  - Text only. This entry serves the text model and skips the vision file (Ornith-1.5-122B-mmproj-F16.gguf) and the optional DFlash2 draft model. The engine template does not pass an mmproj file or a draft model, so ablit does not use the model's MTP speculative decoding either.
  - The model card says it needs llama.cpp build b11670 or newer. The engine lock pins b11749, which is newer. The architecture is qwen35moe, which the pinned llama.cpp source lists.
  - The model card tests with --jinja and --reasoning-format deepseek. The engine template passes neither flag, so the chat template and the thinking output may differ from the card. Nobody has checked.
  - The model card tests with a context of 65536 and 8 parallel requests. This entry uses 4096 tokens and one request, which are ablit's defaults.
  - Ornith-1.5-122B is a Qwen 3.5 family model with 122B parameters in total and 10B active per token (hybrid GatedDeltaNet and attention, with a mixture of experts).
  - The card says refusals were removed and calls the build a research artifact that should not be deployed to end users without separate safety controls. Its harmful-request and MMLU scores are the publisher's own claims, and ablit has not checked them.
