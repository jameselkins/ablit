notes:
  - The entry booted and served on Vast on 2026-10-21, on a 98 GB GPU with 191 GB of RAM or more. The 24 GB GPU floor is not yet tested. It comes from the engine README, which reports one machine with a 24 GB GPU and 90 GB of RAM.
  - The README says 16 GB of VRAM should load but is untested, so the floor here stays at 24 GB.
  - Peak disk comes from the staging list. It assumes the weight parts are deleted as they are joined, and the join step says it streams, because the bootstrap appends one part at a time. The bootstrap adds a margin of one weight part (10.7 GB) to the disk it asks for, because the join appends a part before it deletes it.
  - The staging list has no Engram extraction step. At the pinned engine commit, Ds41Engram::open reads model.safetensors.index.json and the two FP8 shards from the folder given to --engram, so the 203 GB copy that extract_engram.py makes should not be needed. The boot test on 2026-10-21 confirmed this, because the engine read the tables in place. If the engine cannot open the files, the bootstrap extracts the tables and starts the engine again, and that needs about 203 GB more disk than the staging list counts. The disk request already includes 210 GB for it (extract_disk_gb in the engine lock), which costs a few cents an hour and avoids a second rental if the engine cannot open the files in place.
  - The index file model.safetensors.index.json is listed because the engine and extract_engram.py both read it. It is the same file (SHA-256 74b0686a, 7,470,294 bytes) in the September and 1017 official repos and in the dealignai checkpoint.
  - The download floor is 1000 Mbps. At 500 Mbps the 372 GB download alone takes about 100 minutes, and at 1000 Mbps it takes about 50 minutes.
  - The startup estimate is 0.3 hours after the download ends. It is 0.25 hours (the startup figure of the boot-tested llama.cpp entry, which covers the image pull, the container start and the health check) plus 92 seconds for the engine load (the longest time the model cards report) plus 60 seconds for the last join and checksum after the final byte. The total is 0.292 hours, rounded up. It has not been measured for this image.
  - The engine is single-developer research code, and its speed numbers come from one machine.
  - This is the September V4.1 build, not the 1017 refresh. Its Engram tables must come from the September checkpoint, because the 1017 shards have different hashes. The pre-extracted tables in the kaushikvira repo are for the 1017 refresh and do not fit this entry.
