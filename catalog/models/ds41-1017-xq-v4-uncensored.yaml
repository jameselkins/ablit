notes:
  - Nobody has booted this entry, and the hardware floors are not yet tested. The 24 GB GPU and 90 GB RAM floors come from the model card and the engine README, which report one machine with an RTX 4090 and 90 GB of RAM.
  - This is the V4 build, the one the author recommends. Its hottest 1,056 experts stay in DeepSeek's native FP4 (MXFP4), The expert map check in ds41_geometry.hpp at Xolotl 03be8a6 refuses that type, so the entry uses the 961d390 engine lock. The model card also says its speed figures need Xolotl from 2026-10-25 or newer.
  - The author reports higher agreement with the full model than V3 (86.9 percent top-1 and KL 0.306 through the engine, against 82.9 percent and 0.405 for V3), at the same file size.
  - The rank file is v4/rank-1017-v4.bin, which the model card says to use. The repo also holds v4/rank-1017-v3.bin, which V4 first shipped with, and the entry leaves it out.
  - The model card measured its speed with --tier-batch-pcie 0.25. The Xolotl bootstrap passes that value for every entry, and XOLOTL_TIER_BATCH_PCIE changes it.
  - The context is 131072 tokens, so a coding agent with a long system prompt and many tools fits. With --kv-fp4 the engine stores the compressed KV as NVFP4 and the indexer keys as MXFP4. Layers 2, 8 and 14 hold half a row per position and layer 20 holds one row, at 356 bytes a row, so the caches take about 111 MiB at 131072 tokens and about 445 MiB at 524288. The window rings add about 11 MiB. The engine sizes its VRAM expert cache from the free memory after that, so the larger context costs a few experts in VRAM and adds no GPU or host RAM floor. The conversation pool in host memory has a fixed size (4096 MiB), whatever the context.
  - Peak disk comes from the staging list. It assumes the weight parts are deleted as they are joined, and the join step says it streams, because the bootstrap appends one part at a time. The bootstrap adds a margin of one weight part (10.7 GB) to the disk it asks for, because the join appends a part before it deletes it.
  - The staging list has no Engram extraction step. The engine reads model.safetensors.index.json and the two FP8 shards of the official 1017 checkpoint in place, as the boot tests of the V3 entry showed. If it cannot, the bootstrap extracts the tables and starts the engine again, and the disk request already includes room for that (extract_disk_gb in the engine lock).
  - The download floor is 1000 Mbps. At 500 Mbps the 372 GB download alone takes about 100 minutes, and at 1000 Mbps it takes about 50 minutes.
  - The startup estimate is 0.3 hours after the download ends, by the formula in CONTRIBUTING.md. It has not been measured for this build.
  - The engine is single-developer research code, and its speed numbers come from one machine.
  - The repo also holds the V2 and V3 builds. This entry lists only the v4/ directory, the tokenizer files, the Q2_K draft file, the Engram index and the two Engram source shards. The revision is pinned because the repo changes often.
