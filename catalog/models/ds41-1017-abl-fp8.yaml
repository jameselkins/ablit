notes:
  - Hardware floors are not yet tested. They come from the vLLM recipe for the official 1017 checkpoint and from arithmetic on it.
  - The 614 GB figure is the recipe's vram_minimum_gb. The smallest NVIDIA node the recipe lists is 8 GPUs with 80 GB each, with the Engram tables moved to host memory.
  - The 256 GB host RAM floor is derived from the 183 GiB of Engram tables that the recipe keeps in pinned host memory, plus headroom. Nobody has measured the real minimum.
  - Compute capability 9.0 is derived from the node types in the recipe, which are Hopper and newer. The recipe does not say that older GPUs fail.
  - Serving this exact repo with vLLM is untested. Its config and weight index match the official 1017 model, which vLLM supports.
  - The recipe warns that a first boot can run a long autotune, so the startup estimate is a guess.
  - The refusal numbers on the model card were measured on a GGUF file, not on these FP8 files.
