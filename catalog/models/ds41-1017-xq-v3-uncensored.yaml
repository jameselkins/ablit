notes:
  - The current engine image and 131072-token profile are not yet tested for this entry. Earlier boot tests are kept as history and do not approve the current build.
  - The entry booted and served on Vast on 2026-10-22, on a 32 GB RTX 5090. The 24 GB GPU floor is not yet tested. It comes from the engine README, which reports one machine with a 24 GB GPU and 90 GB of RAM.
  - The README says 16 GB of VRAM should load but is untested, so the floor here stays at 24 GB.
  - Peak disk comes from the staging list. It assumes the weight parts are deleted as they are joined, and the join step says it streams, because the bootstrap appends one part at a time. The bootstrap adds a margin of one weight part (10.7 GB) to the disk it asks for, because the join appends a part before it deletes it.
  - The staging list has no Engram extraction step. At the pinned engine commit, Ds41Engram::open reads model.safetensors.index.json and the two FP8 shards from the folder given to --engram, so the 203 GB copy that extract_engram.py makes should not be needed. The boot test on 2026-10-22 confirmed this, because the engine read the tables in place. If the engine cannot open the files, the bootstrap extracts the tables and starts the engine again, and that needs about 203 GB more disk than the staging list counts. The disk request already includes 210 GB for it (extract_disk_gb in the engine lock), which costs a few cents an hour and avoids a second rental if the engine cannot open the files in place.
  - The index file model.safetensors.index.json is listed because the engine and extract_engram.py both read it. It is the same file (SHA-256 74b0686a, 7,470,294 bytes) in the September and 1017 official repos and in the dealignai checkpoint.
  - The download floor is 1000 Mbps. At 500 Mbps the 372 GB download alone takes about 100 minutes, and at 1000 Mbps it takes about 50 minutes.
  - The startup estimate is 0.3 hours after the download ends. It is 0.25 hours (the startup figure of the boot-tested llama.cpp entry, which covers the image pull, the container start and the health check) plus 92 seconds for the engine load (the longest time the model cards report) plus 60 seconds for the last join and checksum after the final byte. The total is 0.292 hours, rounded up. It has not been measured for this image.
  - The engine is single-developer research code, and its speed numbers come from one machine.
  - The kaushikvira repo holds pre-extracted Engram tables for the 1017 refresh. They look identical to what extract_engram.py makes from the official 1017 shards. The file headers, the file sizes and the index file match exactly, and 602 sampled 1 MiB blocks per tensor were byte for byte equal. That is not a full hash comparison. The entry keeps the official shards, because reading them in place makes the tables a second 203 GB download that saves no extraction, and because the tables come from a third party.
  - This entry lists only the v3/ directory, the tokenizer files, the rank file, the Q2_K draft file, the Engram index and the two Engram source shards. The repo also holds a V2 build, which the catalog left out because the author reports V3 as slightly better on agentic tasks.
  - The repo was renamed from GSQ to XQ on 2026-10-19, and old file paths at its root now return 404. The revision is pinned because the repo changes often.
  - The author's model card reports a regression against the September build on two of five tasks in a short agentic test, and says the cause is not isolated yet.
  - The context was raised from 4096 to 131072 tokens on 2026-10-26, together with the move to Xolotl 961d390. The earlier boot tests ran with 4096 tokens on Xolotl 63fc34c and 03be8a6. With --kv-fp4 the compressed KV and indexer keys take about 111 MiB at 131072 tokens (about 890 bytes a position), and the engine sizes its VRAM expert cache from what is left, so the hardware floors stay as they were. The author runs 524288 tokens on a 24 GB card. The V4 1017 entry booted with this context and engine pin on 2026-10-26.
