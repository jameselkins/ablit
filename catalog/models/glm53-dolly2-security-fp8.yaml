  - {url: "https://github.com/jameselkins/ablit/blob/main/CONTRIBUTING.md#numbers-chosen-by-ablit", covers: [profile.host_ram_gb, profile.context_tokens, profile.concurrency, profile.port, profile.startup_hours_estimate, profile.min_download_mbps], note: "The 256 GB host RAM floor and one-hour startup allowance are estimates chosen by ablit. Context is limited to 131072 tokens with one request at a time. Port 8000 and the 1000 Mbps download floor are serving choices, not publisher hardware requirements."}
