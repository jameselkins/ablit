notes:
  - Hardware floors are not yet tested. The GPU profile follows the official base-model recipe, rather than a paid test of this abliterated checkpoint.
  - MoonMath publishes this checkpoint as Dolly 2 Security on Zro. The pinned config uses GlmMoeDsaForCausalLM with blockwise FP8 weights, and all 282 weight shards are listed along with the config, index and tokenizer files.
  - The checkpoint inherits the custom GLM-5.3 license. The model card declares license other and license_name glm-5.3. Read the pinned base-model license before use or redistribution.
  - The 256 GB host RAM floor and one-hour startup estimate are conservative choices by ablit, not measured minima. Download time is counted separately from startup.
  - The base model supports 1048576 tokens of context. This profile uses 131072 tokens and one concurrent request; the smaller context is an ablit choice.
  - The current vLLM engine is available for planning only. Paid launches are blocked until its image is pinned and the backend is enabled.
  - The official recipe requires vLLM 0.29.0 or newer and uses FP8 KV cache plus glm47 reasoning and tool-call parsers. Those serving settings and this checkpoint still need a boot test.
  - The publisher reports evaluation results for this model. ablit has not reproduced those evaluations.
