name: CI

# CI never rents a machine, uses no secrets, and asks for read-only access.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the package and the lint dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[lint]"

      - name: Check the code with ruff
        run: ruff check .

      - name: Check the types with mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and the test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Run the tests
        run: python -m pytest -q

      - name: Check the import contract
        run: lint-imports

      - name: Check every catalog entry offline
        run: |
          status=0
          for entry in catalog/models/*.yaml; do
            python tools/verify_entry.py --offline "$entry" || status=1
          done
          exit "$status"

      - name: Build the catalog
        run: python tools/build_catalog.py

      - name: Check the engine scripts
        run: |
          for script in engines/lib/common.sh engines/*/bootstrap.sh engines/*/health.sh; do
            bash -n "$script"
          done
          shellcheck -x -S warning engines/lib/common.sh engines/*/bootstrap.sh engines/*/health.sh
