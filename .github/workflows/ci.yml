name: CI

# CI never rents a machine, uses no secrets, and asks for read-only access.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the package and the lint dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[lint]"

      - name: Check the code with ruff
        run: ruff check .

      - name: Check the types with mypy
        run: mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and the test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Use the system Bash for macOS shell tests
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/ablit-bash"
          ln -s /bin/bash "$RUNNER_TEMP/ablit-bash/bash"
          echo "$RUNNER_TEMP/ablit-bash" >> "$GITHUB_PATH"

      - name: Run the tests
        run: python -m pytest -q

      - name: Check the import contract
        run: lint-imports

      - name: Check every catalog entry offline
        run: |
          status=0
          for entry in catalog/models/*.yaml; do
            python tools/verify_entry.py --offline "$entry" || status=1
          done
          exit "$status"

      - name: Build the catalog
        run: python tools/build_catalog.py

      - name: Check engine script syntax
        run: |
          for script in engines/lib/common.sh engines/*/bootstrap.sh engines/*/health.sh; do
            bash -n "$script"
          done

      - name: Lint the engine scripts
        if: runner.os == 'Linux'
        run: shellcheck -x -S warning engines/lib/common.sh engines/*/bootstrap.sh engines/*/health.sh

      - name: Check launch bundles from the installed wheel
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          python -m pip install build
          python -m build
          python -m venv "$RUNNER_TEMP/ablit-install"
          "$RUNNER_TEMP/ablit-install/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/ablit-install/bin/python" -I tools/check_install.py
