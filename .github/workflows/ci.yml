name: CI

# CI never rents a machine, uses no secrets, and asks for read-only access.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and the test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "cli[test]"

      - name: Run the tests
        working-directory: cli
        run: python -m pytest -q

      - name: Check the import contract
        working-directory: cli
        run: lint-imports

      - name: Check every catalog entry offline
        run: |
          status=0
          for entry in catalog/models/*.yaml; do
            python tools/verify_entry.py --offline "$entry" || status=1
          done
          exit "$status"

      - name: Build the catalog
        run: python tools/build_catalog.py

      - name: Check the engine scripts
        run: |
          for script in engines/lib/common.sh engines/*/bootstrap.sh engines/*/health.sh; do
            bash -n "$script"
          done
          shellcheck -x -S warning engines/lib/common.sh engines/*/bootstrap.sh engines/*/health.sh
