name: Weekly catalog check

# Re-runs the Hugging Face checks on every catalog entry and fails if any
# artifact has disappeared or changed. It makes anonymous requests only. It
# never rents a machine and uses no secrets.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the package
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Verify every entry against Hugging Face
        run: |
          status=0
          for entry in catalog/models/*.yaml; do
            python tools/verify_entry.py "$entry" || status=1
          done
          exit "$status"
