[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ablit"
dynamic = ["version"]
description = "Find the cheapest rented GPU machine that can run a model, and start it with an OpenAI-compatible endpoint."
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "James Elkins" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx",
    "pyyaml",
    "pydantic>=2",
    "keyring",
    "huggingface_hub",
]

[project.optional-dependencies]
test = [
    "pytest",
    "hypothesis",
    "respx",
    "import-linter",
]
lint = [
    "ruff>=0.11",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/jameselkins/ablit"
Issues = "https://github.com/jameselkins/ablit/issues"

[project.scripts]
ablit = "ablit.cli:main"

[tool.hatch.version]
path = "cli/ablit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["cli/ablit"]

# The catalog and engine templates live at the top of the repository. The
# wheel carries copies in ablit/_data, which catalog.loader.repo_root finds.
[tool.hatch.build.targets.wheel.force-include]
"catalog/models" = "ablit/_data/catalog/models"
"catalog/schema" = "ablit/_data/catalog/schema"
"catalog/VERSION" = "ablit/_data/catalog/VERSION"
"catalog/LICENSE" = "ablit/_data/catalog/LICENSE"
"engines" = "ablit/_data/engines"

[tool.hatch.build.targets.sdist]
include = ["cli/ablit", "cli/tests", "catalog/models", "catalog/schema", "catalog/VERSION",
           "catalog/LICENSE", "engines", "tools", ".importlinter", "LICENSE", "NOTICE", "README.md",
           "AGENTS.md", "CONTRIBUTING.md", "POLICY.md", "SECURITY.md", "docs", "backends"]

[tool.pytest.ini_options]
testpaths = ["cli/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["uv.lock"]

[tool.ruff.lint]
# E9 and F find syntax errors and unused or undefined names. B finds likely bugs.
# B904 stays off because adding "from" to a raise changes the traceback that users see.
# The I, UP and SIM sets are not on yet. They would touch most files, so they wait
# until the parallel branches have merged.
select = ["E9", "F", "B"]
ignore = ["B904"]

[tool.mypy]
python_version = "3.11"
files = ["cli/ablit"]
mypy_path = "cli"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false

# Each override below silences one known finding in one module. The findings are
# listed here so they can be fixed and the override removed. Source edits wait
# because other branches are changing backends/ and runs/commands.py.
[[tool.mypy.overrides]]
module = ["ablit.engines", "ablit.runs.commands"]
# repo_root() is typed Path | None, and these callers use it without a check.
disable_error_code = ["operator"]

[[tool.mypy.overrides]]
module = "ablit.runs.ssh"
# Popen.stdout is Optional, and logs() reads it after opening it with a pipe.
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
module = "ablit.runs.lifecycle"
# An earlier except clause deletes the name error, and a later loop reuses the name.
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "ablit.backends.vast"
# The rate can be None in a partial listing, and Allocation types the rate as float.
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "ablit.cli"
# Backend has no close() in its protocol, and the list of active runs holds None on error.
disable_error_code = ["attr-defined", "list-item"]
